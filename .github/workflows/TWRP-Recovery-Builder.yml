name: TWRP VendorBoot Builder FINAL (Stable)

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: "Device tree repo"
        required: true
        default: "https://github.com/XPXC87/android_device_xiaomi_rothko_twrp"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-14.1_a16"
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "rothko"
      ORIGINAL_VENDOR_BOOT:
        description: "原廠 vendor_boot.img 下載連結"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # 🔥 清空空間
    - name: 清理磁碟
      uses: rokibhasansagar/slimhub_actions@main

    # 🔥 Swap（輔助）
    - name: 設置 Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: 安裝依賴
      run: |
        sudo apt update
        sudo apt install -y git-core repo bc bison build-essential zip curl \
        gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
        x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip fontconfig cpio

    - name: 初始化 Repo + Device Tree
      run: |
        mkdir workspace
        cd workspace

        repo init --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-14.1

        mkdir -p device/xiaomi
        git clone ${{ github.event.inputs.DEVICE_TREE }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          device/xiaomi/${{ github.event.inputs.DEVICE_NAME }}

    - name: Repo Sync（低負載）
      run: |
        cd workspace
        repo sync -c --no-clone-bundle --no-tags -j2

    # 🔥 修 kernel.mk TAB 問題（關鍵）
    - name: 修復 kernel.mk
      run: |
        cd workspace
        sed -i 's/^    /\t/' vendor/twrp/build/tasks/kernel.mk || true

    - name: 編譯（低記憶體穩定🔥）
      run: |
        cd workspace
        source build/envsetup.sh

        export ALLOW_MISSING_DEPENDENCIES=true
        export TW_FORCE_VENDOR_BOOT=true

        # 🔥 防止 OOM
        export SOONG_UI_THREADS=2
        export NINJA_ARGS=-j2
        export _JAVA_OPTIONS="-Xmx2g"

        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-userdebug

        mka recoveryimage -j2

    - name: 打包 recovery.cpio（正確來源）
      run: |
        cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root

        find . | cpio -o -H newc --owner root:root > ../../recovery.cpio

        cd ../../
        echo "==== 驗證 cpio ===="
        file recovery.cpio
        cpio -t < recovery.cpio | head

    - name: 下載 magiskboot
      run: |
        cd workspace
        curl -L -o magiskboot https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot
        chmod +x magiskboot

    - name: 下載原廠 vendor_boot
      run: |
        cd workspace
        curl -L "${{ github.event.inputs.ORIGINAL_VENDOR_BOOT }}" -o vendor_boot.img
        ls -lh vendor_boot.img

    - name: 注入 TWRP（核心🔥）
      run: |
        cd workspace

        ./magiskboot unpack vendor_boot.img

        rm -f ramdisk.cpio
        cp out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.cpio ramdisk.cpio

        ./magiskboot repack vendor_boot.img

        mv new-boot.img vendor_boot_twrp.img
        ls -lh vendor_boot_twrp.img

    - name: 上傳 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: twrp-${{ github.run_id }}
        name: TWRP VendorBoot Build
        files: |
          workspace/vendor_boot_twrp.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.cpio
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
